<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1 class="main-heading">Recipe Finder</h1>

        <div class="searchBox">
            <input type="text" id="searchInput" placeholder="Search recipe...">
            <button id="searchBtn">Search</button>
        </div>
        <p id="message"></p>
        <p id="message"></p>
        <div id="recipeContainer" class="recipe-container">
            <div class="cards">
                <img src="https://images.pexels.com/photos/24513338/pexels-photo-24513338.jpeg" alt="">
                <div class="recipeContent">
                    <h2>Pizza</h2>
                    <p>
                        Category:Fast Food
                    </p>
                    <p>
                        Cousine:Italian
                    </p>

                    <button class="view">View Recipe</button>
                </div>
            </div>
            <div class="cards">
                <img src="https://images.pexels.com/photos/24513338/pexels-photo-24513338.jpeg" alt="">
                <div class="recipeContent">
                    <h2>Pizza</h2>
                    <p>
                        Category:Fast Food
                    </p>
                    <p>
                        Cousine:Italian
                    </p>

                    <button class="view">View Recipe</button>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
